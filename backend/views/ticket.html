<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vé Xem Phim</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: #fff;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .ticket {
            background: #fff;
            color: #121212;
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        .ticket::before, .ticket::after {
            content: '';
            position: absolute;
            top: 60%;
            width: 30px;
            height: 30px;
            background-color: #121212;
            border-radius: 50%;
            z-index: 1;
        }
        .ticket::before {
            left: -15px;
        }
        .ticket::after {
            right: -15px;
        }
        .ticket-header {
            padding: 30px 20px 20px;
            text-align: center;
            border-bottom: 2px dashed #ccc;
        }
        .movie-title {
            font-size: 24px;
            font-weight: 800;
            text-transform: uppercase;
            margin: 0 0 10px;
        }
        .cinema-badge {
            background-color: #E50914;
            color: #fff;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            display: inline-block;
        }
        .ticket-body {
            padding: 30px 30px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .info-block {
            display: flex;
            flex-direction: column;
        }
        .info-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 5px;
        }
        .info-value {
            font-size: 16px;
            font-weight: 800;
        }
        .ticket-footer {
            padding: 20px;
            text-align: center;
            background: #f8f8f8;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            margin-top: 20px;
        }
        .status-badge {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 600;
            margin-bottom: 15px;
        }
        .status-active { background-color: #4CAF50; color: white; }
        .status-used { background-color: #f44336; color: white; }
        .status-expired { background-color: #9e9e9e; color: white; }
        .ticket-code {
            font-family: monospace;
            font-size: 18px;
            letter-spacing: 2px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="ticket">
        <div class="ticket-header">
            <h1 class="movie-title">{{TEN_PHIM}}</h1>
            <div class="cinema-badge">{{TEN_RAP}}</div>
        </div>
        <div class="ticket-body">
            <div class="info-block">
                <span class="info-label">Date</span>
                <span class="info-value">{{NGAY_CHIEU}}</span>
            </div>
            <div class="info-block">
                <span class="info-label">Time</span>
                <span class="info-value">{{GIO_CHIEU}}</span>
            </div>
            <div class="info-block">
                <span class="info-label">Room</span>
                <span class="info-value">{{TEN_PHONG}}</span>
            </div>
            <div class="info-block">
                <span class="info-label">Seat</span>
                <span class="info-value">{{TEN_GHE}}</span>
            </div>
        </div>
        <div class="ticket-footer">
            <div class="status-badge {{STATUS_CLASS}}">{{STATUS_TEXT}}</div>
            <div class="ticket-code">{{MA_VE}}</div>
        </div>
    </div>
</body>
</html>
